services:
  worker:
    environment:
      OUTBOX_ENABLED: "1"
      SEND_STRATEGY: "redis"
      OUTBOX_DB_WORKER: "0"      # игнорировать БД-фильтры
      OUTBOX_REQUIRE_LEAD: "0"   # не требовать lead
      OUTBOX_WHITELIST: "*"      # разрешить любые номера
      ALLOW_NO_LEAD: "1"         # запасной флаг
