services:
  worker:
    environment:
      OUTBOX_ENABLED: "1"
      SEND_STRATEGY: "redis"
      OUTBOX_DB_WORKER: "0"      # не читать правила из БД
      OUTBOX_WHITELIST: "*"      # разрешить любые номера
      OUTBOX_REQUIRE_LEAD: "0"   # не требовать lead
      ALLOW_NO_LEAD: "1"         # запасной флаг, если используется в коде
