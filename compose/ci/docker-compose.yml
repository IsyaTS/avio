services:
  app:
    environment:
      WORKER_BASE_URL: http://mocktg:8085
      ASSET_VERSION: ${ASSET_VERSION:-}
    depends_on:
      mocktg:
        condition: service_started
  worker:
    environment:
      OUTBOX_ENABLED: "0"
      OUTBOX_DB_WORKER: "0"
      INBOX_ENABLED: "1"
      INCOMING_QUEUE_KEY: inbox:message_in
      SMART_REPLY_ENABLED: "1"
  mocktg:
    image: python:3.11-slim
    command: ["python", "/mock/mock_tgworker.py"]
    working_dir: /mock
    volumes:
      - ./tools/mock_tgworker.py:/mock/mock_tgworker.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 5
