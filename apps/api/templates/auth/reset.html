{% extends "marketing/base.html" %}
{% block content %}
  <section class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Новый пароль</h1>
      <p class="auth-lead">Введите новый пароль для аккаунта.</p>
      {% if error %}
        <div class="auth-alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="/auth/reset" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <input type="hidden" name="token" value="{{ token }}" />
        <label class="auth-field">
          <span class="auth-label">Новый пароль</span>
          <input class="auth-input" type="password" name="password" required autocomplete="new-password" />
        </label>
        <label class="auth-field">
          <span class="auth-label">Повторите пароль</span>
          <input class="auth-input" type="password" name="confirm_password" required autocomplete="new-password" />
        </label>
        <button class="btn btn--primary auth-submit" type="submit">Сохранить пароль</button>
      </form>
      <div class="auth-links">
        <a href="/login">Вернуться к входу</a>
      </div>
    </div>
  </section>
{% endblock %}
