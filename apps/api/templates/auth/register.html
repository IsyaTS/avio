{% extends "marketing/base.html" %}
{% block content %}
  <section class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Регистрация</h1>
      <p class="auth-lead">Создайте кабинет и получите доступ к настройкам.</p>
      {% if error %}
        <div class="auth-alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="/auth/register" class="js-register-form auth-form auth-form--register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label class="auth-field">
          <span class="auth-label">Email</span>
          <input class="auth-input" type="email" name="email" value="{{ email or '' }}" required autocomplete="email" />
        </label>
        <label class="auth-field">
          <span class="auth-label">Телефон</span>
          <input class="auth-input" type="tel" name="phone" value="{{ phone or '' }}" required autocomplete="tel" />
        </label>
        <label class="auth-field">
          <span class="auth-label">Пароль</span>
          <input class="auth-input" type="password" name="password" required autocomplete="new-password" />
        </label>
        <label class="auth-field">
          <span class="auth-label">Повторите пароль</span>
          <input class="auth-input" type="password" name="confirm_password" required autocomplete="new-password" />
        </label>
        <div class="extra-fields" data-extra-fields>
          <label class="auth-field">
            <span class="auth-label">Контакт (ник Telegram или другое)</span>
            <input class="auth-input" type="text" name="contact" value="{{ contact or '' }}" required autocomplete="username" />
          </label>
          <label class="auth-field">
            <span class="auth-label">Где удобно принять менеджера</span>
            <input class="auth-input" type="text" name="messenger" value="{{ messenger or '' }}" required placeholder="Например: Telegram или звонок" autocomplete="off" />
          </label>
        </div>
        <button class="btn btn--primary auth-submit" type="submit">Создать аккаунт</button>
      </form>
      <div class="auth-links">
        <a href="/login">Уже есть аккаунт?</a>
      </div>
    </div>
  </section>
{% endblock %}
