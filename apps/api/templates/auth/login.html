{% extends "marketing/base.html" %}
{% block content %}
  <section class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Войти в кабинет</h1>
      <p class="auth-lead">Используйте email и пароль, чтобы продолжить работу.</p>
      {% if error %}
        <div class="auth-alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="/auth/login" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        {% if next %}
          <input type="hidden" name="next" value="{{ next }}" />
        {% endif %}
        <label class="auth-field">
          <span class="auth-label">Email</span>
          <input class="auth-input" type="email" name="email" required autocomplete="email" />
        </label>
        <label class="auth-field">
          <span class="auth-label">Пароль</span>
          <input class="auth-input" type="password" name="password" required autocomplete="current-password" />
        </label>
        <button class="btn btn--primary auth-submit" type="submit">Войти</button>
      </form>
      <div class="auth-links">
        <a href="/forgot">Забыли пароль?</a>
        <a href="/register">Создать аккаунт</a>
      </div>
    </div>
  </section>
{% endblock %}
