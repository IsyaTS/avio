<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or 'Клиентский кабинет' }}</title>
    {% set spa_assets = client_spa_assets(request) %}
    {% if spa_assets.css %}
      {% for css in spa_assets.css %}
        <link rel="stylesheet" href="{{ css }}" />
      {% endfor %}
    {% endif %}
    {% if spa_assets.dev_server %}
      <script type="module" src="{{ spa_assets.dev_server }}/@vite/client"></script>
    {% endif %}
  </head>
  <body>
    <script id="client-settings-state" type="application/json">{{ client_state_json }}</script>
    <div id="root"></div>
    {% if spa_assets.js %}
      {% for js in spa_assets.js %}
        <script type="module" src="{{ js }}"></script>
      {% endfor %}
    {% endif %}
  </body>
</html>
