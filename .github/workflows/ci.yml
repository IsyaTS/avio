name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set asset version
        run: echo "ASSET_VERSION=${GITHUB_SHA:0:10}" >> "$GITHUB_ENV"
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff==0.5.5 flake8
      - name: Ruff lint
        run: |
          ruff check \
            --select E,F \
            --ignore E402,E501 \
            apps/tgworker \
            tests \
            apps/api/web/public.py \
            tests/conftest.py \
            tests/test_main_webhook.py \
            tests/test_public_tg.py \
            scripts/runtime_log_guard.py \
            scripts/ui_http_smoke.py \
            scripts/release_scope_guard.py
      - name: Flake8 lint
        run: |
          flake8 \
            --select=E,F \
            --extend-ignore=E402,E501 \
            apps/tgworker \
            tests \
            apps/api/web/public.py \
            tests/conftest.py \
            tests/test_main_webhook.py \
            tests/test_public_tg.py \
            scripts/runtime_log_guard.py \
            scripts/ui_http_smoke.py \
            scripts/release_scope_guard.py
      - name: Pytest
        run: pytest -q
      - name: Test truth audit
        run: python scripts/test_truth_audit.py tests
      - name: Monolith guard
        run: python scripts/monolith_guard.py
      - name: Release scope guard
        run: python scripts/release_scope_guard.py --strict
      - name: Dialog quality gate (eval-lite)
        run: python scripts/dialog_quality_runner.py --cases scripts/dialog_quality_ci_cases.json --iterations 1

  build-image:
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set asset version
        run: echo "ASSET_VERSION=${GITHUB_SHA:0:10}" >> "$GITHUB_ENV"
      - name: Build app image
        run: docker build --target app -t avio/app:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set asset version
        run: echo "ASSET_VERSION=${GITHUB_SHA:0:10}" >> "$GITHUB_ENV"
      - name: Prepare environment file
        run: |
          cat <<'ENV' > .env
          ADMIN_TOKEN=test-admin
          PUBLIC_KEY=test-public-key
          TELEGRAM_API_ID=0
          TELEGRAM_API_HASH=
          POSTGRES_PASSWORD=postgres
          ENV
      - name: Build app image
        run: docker build --target app -t avio/app:ci .
      - name: Start services
        run: docker compose -f docker-compose.yml -f compose/ci/docker-compose.yml up -d app worker mocktg redis
      - name: Wait for app health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App health check failed" >&2
          docker compose logs app
          exit 1
      - name: Critical health smoke
        run: ADMIN_TOKEN=test-admin python scripts/critical_smoke.py --base-url http://localhost:8000 --tenants 1,3
      - name: Critical tenant settings smoke
        run: |
          ADMIN_TOKEN=test-admin PUBLIC_KEY=test-public-key \
            python scripts/critical_smoke.py \
              --base-url http://localhost:8000 \
              --tenants 1,3 \
              --mode test-tenant-write \
              --write-tenant 999999 \
              --public-key test-public-key
      - name: UI HTTP smoke
        run: |
          PUBLIC_KEY=test-public-key \
            python scripts/ui_http_smoke.py \
              --base-url http://localhost:8000 \
              --tenant 999999 \
              --public-key test-public-key
      - name: Restart persistence smoke
        run: |
          PUBLIC_KEY=test-public-key \
            python scripts/restart_persistence_smoke.py \
              --base-url http://localhost:8000 \
              --tenant 999999 \
              --public-key test-public-key \
              --services app \
              --compose-file docker-compose.yml \
              --compose-file compose/ci/docker-compose.yml
      - name: Inbox worker smoke
        run: |
          PUBLIC_KEY=test-public-key \
            python scripts/inbox_worker_smoke.py \
              --base-url http://localhost:8000 \
              --tenant 999999 \
              --public-key test-public-key \
              --compose-file docker-compose.yml \
              --compose-file compose/ci/docker-compose.yml
      - name: Runtime log guard
        run: |
          python scripts/runtime_log_guard.py \
            --compose-file docker-compose.yml \
            --compose-file compose/ci/docker-compose.yml \
            --service app \
            --service worker \
            --tail 1200 \
            --outbox-disabled
      - name: Smoke test public start
        run: |
          curl -fsS -H "X-Admin-Token: test-admin" "http://localhost:8000/pub/tg/start?tenant=1"
      - name: Smoke test twofa submit
        run: |
          curl -fsS -H "Content-Type: application/json" -H "X-Admin-Token: test-admin" \
            -d '{"password":"demo"}' http://localhost:8000/pub/tg/password?tenant=1
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f compose/ci/docker-compose.yml down -v
